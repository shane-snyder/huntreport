---
# Source-of-truth ArgoCD Application for HuntReport (autonomous-mode agent).
#
# In agent-based ArgoCD with the autonomous-agent pattern, the Application is
# created on the SPOKE cluster (sno-mini) in the local `argocd-agent`
# namespace. The agent's principal then mirrors it back up to the hub at
# `argocd-agent-sno-mini/<name>` for status visibility — but the spoke is the
# source of truth for the spec.
#
# Apply on sno-mini, not on sno hub:
#   oc login -u kubeadmin -p $(cat ~/Documents/SNO-MINI/kubeadmin) \
#     --server=https://api.sno-mini.shanehomelab.com:6443
#   oc apply -f bootstrap/argocd-application.yaml
#
# Watch the mirror on the hub:
#   oc -n argocd-agent-sno-mini get application huntreport -w

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: huntreport
  namespace: argocd-agent
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app-source: huntreport
    repo: huntreport
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: cluster-config
  destination:
    namespace: huntreport
    server: https://kubernetes.default.svc
  source:
    path: openshift
    repoURL: https://github.com/shane-snyder/huntreport.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
