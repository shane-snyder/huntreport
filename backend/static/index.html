<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HuntReport — Whitetail Movement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e08;--surface:#15180f;--surface2:#1c2014;--surface3:#252a18;
  --border:rgba(176,141,87,.22);--border2:rgba(176,141,87,.36);
  --gold:#e6b450;--rust:#c66a3a;--olive:#8aa53a;--blood:#8a2b2b;
  --text:#ece5d4;--text2:rgba(236,229,212,.66);--text3:rgba(236,229,212,.40);
  --prime:#e6b450;--good:#8aa53a;--fair:#b08d57;--slow:#5a5230;--poor:#3a3525;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}

.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:1px solid var(--border);background:rgba(12,14,8,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:5px;color:var(--gold)}
.tag{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:2px;color:var(--text3);border:1px solid var(--border);padding:4px 10px;border-radius:999px}

.hero{padding:54px 20px 36px;background:linear-gradient(140deg,#0c0e08 0%,#15180f 50%,#252a18 100%);border-bottom:1px solid var(--border);text-align:center}
.headline{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.6rem,7vw,5rem);letter-spacing:7px;line-height:.95;color:#fff;margin-bottom:6px}
.headline span{color:var(--gold)}
.sub{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:2px;color:var(--text3);margin-bottom:28px}
.search-wrap{display:flex;gap:8px;max-width:640px;margin:0 auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px}
.s-input{flex:1;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:12px 18px;color:#fff;font-family:'Inter',sans-serif;font-size:1rem;outline:none}
.s-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,180,80,.16)}
.s-input::placeholder{color:rgba(255,255,255,.45)}
.s-btn{background:var(--gold);border:none;border-radius:999px;padding:12px 22px;color:#1c1707;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2.5px;cursor:pointer;white-space:nowrap}
.s-btn:hover{opacity:.85}
.gps-btn{background:none;border:1px solid rgba(255,255,255,.22);color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:2px;padding:8px 16px;border-radius:999px;cursor:pointer;margin-top:12px}
.gps-btn:hover{border-color:var(--gold);background:rgba(230,180,80,.10)}
.err{display:none;margin:14px auto 0;max-width:560px;padding:10px 14px;background:rgba(198,106,58,.14);border:1px solid rgba(198,106,58,.32);border-radius:8px;color:#e6936a;font-family:'JetBrains Mono',monospace;font-size:.7rem}

.loader{display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:14px}
.loader-bar{width:120px;height:2px;background:var(--surface3);border-radius:1px;overflow:hidden;position:relative}
.loader-bar::after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;background:var(--gold);animation:sweep 1s linear infinite}
@keyframes sweep{to{left:100%}}
.load-txt{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:2.5px;color:var(--text3)}

#rpt{display:none;max-width:1100px;margin:0 auto;padding:24px 20px 60px}

/* ── Header strip ── */
.r-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:18px}
.r-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.5rem,3vw,2.4rem);letter-spacing:3px}
.r-coords{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:1.5px;color:var(--text3);margin-top:2px}
.phase-pill{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:2px;padding:5px 10px;border-radius:999px;border:1px solid var(--border)}
.phase-pill.peak_rut{border-color:var(--blood);background:rgba(138,43,43,.18);color:#d97070}
.phase-pill.pre_rut,.phase-pill.post_rut{border-color:var(--gold);background:rgba(230,180,80,.10);color:var(--gold)}
.phase-pill.late_season,.phase-pill.early_season{border-color:var(--olive);background:rgba(138,165,58,.14);color:#b8d250}

/* ── BIG HERO NUMBER for the selected day ── */
.bignum{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px 30px;margin-bottom:18px}
.bn-num{font-family:'Bebas Neue',sans-serif;font-size:5.6rem;line-height:.95;letter-spacing:1px;color:var(--gold)}
.bn-suffix{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px;color:var(--text3);margin-left:4px}
.bn-meta{display:flex;flex-direction:column;gap:6px;text-align:right}
.bn-row{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:1.5px;color:var(--text3)}
.bn-row strong{color:var(--text);font-weight:700}

/* ── Week strip ── */
.sec{font-family:'Bebas Neue',sans-serif;letter-spacing:5px;color:var(--gold);font-size:1rem;margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);text-transform:uppercase}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:6px}
.dc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 8px;cursor:pointer;text-align:center;transition:all .15s;position:relative}
.dc:hover{border-color:var(--border2);transform:translateY(-1px)}
.dc.active{border-color:var(--gold);background:rgba(230,180,80,.10)}
.dc.best::before{content:'★';position:absolute;top:-8px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:.8rem;background:var(--bg);padding:0 4px}
.dc-day{font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:2px;color:var(--text3);font-weight:700}
.dc.active .dc-day{color:var(--gold)}
.dc-num{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1;margin:6px 0 2px;letter-spacing:.5px;color:var(--gold)}
.dc-pct{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--text3);letter-spacing:.5px}
.dc-tlo{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--text3);letter-spacing:.5px;margin-top:5px}
.dc-icon{font-size:.95rem;margin-top:3px;line-height:1}

/* ── Hourly chart ── */
.hourly-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px 22px 18px;margin-bottom:18px;position:relative}
.hourly-grid{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:200px;margin-top:8px;position:relative;align-items:stretch}
/* Each column is the full chart height; the bar sits at the bottom and grows up by score% */
.hh{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border-radius:3px 3px 0 0;background:transparent}
.hh::before{content:'';position:absolute;bottom:0;left:0;right:0;top:0;border-radius:3px 3px 0 0;background:rgba(255,255,255,.025);pointer-events:none}
.hh:hover{filter:brightness(1.25)}
.hh.now{outline:2px solid var(--rust);outline-offset:2px;z-index:3;border-radius:3px 3px 4px 4px}
.hh-bar{width:100%;border-radius:3px 3px 0 0;min-height:3px;position:relative;z-index:1;box-shadow:0 -1px 0 rgba(255,255,255,.05) inset}
.hh-pct{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:700;letter-spacing:0;white-space:nowrap;color:var(--text2);display:none;z-index:4}
.hh.peak .hh-pct{display:block;color:var(--gold)}
.hh-axis{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;font-family:'JetBrains Mono',monospace;font-size:.5rem;color:var(--text3);margin-top:6px;text-align:center}
.solar-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(230,180,80,.55);z-index:2;pointer-events:none}
.solar-line.sunset{background:rgba(198,106,58,.55)}
.solar-line::after{content:attr(data-label);position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:.5rem;color:var(--text3);white-space:nowrap}
.hh-tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border2);border-radius:6px;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--text);white-space:nowrap;display:none;z-index:6;box-shadow:0 6px 16px rgba(0,0,0,.5);pointer-events:none}
.hh-tip-row{margin:2px 0}
.hh:hover .hh-tip{display:block}

.legend{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--text3);letter-spacing:1px}
.lg-item{display:flex;align-items:center;gap:5px}
.lg-dot{width:10px;height:10px;border-radius:2px}
.lg-scale{display:flex;flex-direction:column;flex:1;min-width:240px;max-width:340px}
.lg-bar{height:8px;border-radius:4px}
.lg-ticks{display:flex;justify-content:space-between;margin-top:3px;font-size:.5rem;color:var(--text3);letter-spacing:0}

/* ── Compact conditions row ── */
.cond{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.cd{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.cd-lbl{font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:2px;color:var(--text3);margin-bottom:4px}
.cd-val{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;line-height:1;color:var(--text);letter-spacing:1px}
.cd-unit{font-size:.75rem;color:var(--text3);margin-left:2px}
.cd-sub{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--text3);margin-top:3px;letter-spacing:.5px}
.cd-sub.up{color:var(--good)}
.cd-sub.down{color:var(--rust)}

/* ── Spots (minimal, expandable) ── */
.spots-toggle{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:2px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;margin:18px 0}
.spots-toggle:hover{border-color:var(--gold);color:var(--gold)}
.spots-list{display:none;margin-top:8px}
.spots-list.show{display:block}
.spot-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-family:'JetBrains Mono',monospace;font-size:.7rem}
.spot-name{color:var(--text)}
.spot-dist{color:var(--text3);font-size:.6rem}

footer{padding:24px 20px;text-align:center;border-top:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:2px;color:var(--text3)}

@media (max-width:600px){
  .week{grid-template-columns:repeat(7,1fr);gap:4px}
  .dc{padding:8px 4px}
  .dc-num{font-size:1.4rem}
  .bignum{flex-direction:column;align-items:flex-start;gap:14px}
  .bn-meta{text-align:left}
  .top-bar{padding:12px 16px}
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">HUNT<span style="color:#fff">REPORT</span></div>
  <div class="tag">WHITETAIL</div>
</div>

<section class="hero">
  <h1 class="headline">HUNT<span>REPORT</span></h1>
  <div class="sub">WHITETAIL MOVEMENT · NEXT 7 DAYS</div>
  <div class="search-wrap">
    <input id="locInput" class="s-input" type="text" placeholder="City, state, or hunting area…" autocomplete="off">
    <button id="searchBtn" class="s-btn">SCOUT</button>
  </div>
  <button id="gpsBtn" class="gps-btn">USE MY LOCATION</button>
  <div id="errBox" class="err"></div>
</section>

<div id="loader" class="loader">
  <div class="loader-bar"></div>
  <div class="load-txt">SCORING…</div>
</div>

<main id="rpt">
  <div class="r-head">
    <div>
      <div class="r-name" id="rName"></div>
      <div class="r-coords" id="rCoords"></div>
    </div>
    <div id="rPhase"></div>
  </div>

  <div class="bignum" id="bignum"></div>

  <h2 class="sec">WEEK · TAP TO COMPARE</h2>
  <div class="week" id="week"></div>

  <h2 class="sec" id="hourlySec">HOURLY MOVEMENT %</h2>
  <div class="hourly-box">
    <div class="hourly-grid" id="hourlyGrid"></div>
    <div class="hh-axis" id="hourlyAxis"></div>
    <div class="legend">
      <div class="lg-scale" id="lgScale"></div>
      <span class="lg-item"><span class="lg-dot" style="background:rgba(230,180,80,.7);width:2px"></span>SUNRISE</span>
      <span class="lg-item"><span class="lg-dot" style="background:rgba(198,106,58,.7);width:2px"></span>SUNSET</span>
    </div>
  </div>

  <h2 class="sec">CONDITIONS</h2>
  <div class="cond" id="cond"></div>

  <button class="spots-toggle" onclick="document.getElementById('spotsList').classList.toggle('show')">NEARBY PUBLIC LAND ▾</button>
  <div class="spots-list" id="spotsList"></div>
</main>

<footer>HUNTREPORT · OPEN-METEO · NOMINATIM · OPENSTREETMAP · USGS</footer>

<script>
const $ = id => document.getElementById(id);
let _last = { lat:null, lon:null, name:'', dayIdx:0, data:null };

function showLoader(on){
  $('loader').style.display = on ? 'flex' : 'none';
  $('rpt').style.display    = on ? 'none' : ($('rpt').dataset.hasReport==='1' ? 'block' : 'none');
}
function showErr(m){ const e=$('errBox'); e.textContent=m; e.style.display='block'; }
function hideErr(){ $('errBox').style.display='none'; }

const WX = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌦',55:'🌧',61:'🌧',63:'🌧',65:'🌧',71:'🌨',73:'🌨',75:'❄️',80:'🌧',81:'🌧',82:'⛈',95:'⛈',96:'⛈',99:'⛈'};

// Continuous score → color. HSL interpolation along an earth-tone gradient
// from dark earth (low) → olive (mid) → gold (high). No discrete bands, so
// adjacent bars with similar scores look similar.
function scoreColor(s){
  const t = Math.max(0, Math.min(100, s)) / 100;
  // hue 32 → 46 (warm brown → gold)
  const h = 32 + t * 14;
  const sat = 18 + t * 62;
  const lit = 12 + t * 44;
  const top = `hsl(${h}, ${sat}%, ${Math.min(70, lit + 10)}%)`;
  const bot = `hsl(${h}, ${sat}%, ${lit}%)`;
  return `linear-gradient(180deg, ${top} 0%, ${bot} 100%)`;
}
// Coarser tier for the day cards / big number — same gradient endpoints
function scoreTextColor(s){
  const t = Math.max(0, Math.min(100, s)) / 100;
  const h = 32 + t * 14;
  const sat = 30 + t * 55;
  const lit = 35 + t * 30;
  return `hsl(${h}, ${sat}%, ${lit}%)`;
}
function buildLegendScale(){
  const stops = [];
  for (let s = 0; s <= 100; s += 10){
    const t = s/100;
    const h = 32 + t * 14, sat = 18 + t * 62, lit = 12 + t * 44;
    stops.push(`hsl(${h}, ${sat}%, ${lit}%) ${s}%`);
  }
  const el = document.getElementById('lgScale');
  if (el) el.innerHTML =
    `<div class="lg-bar" style="background:linear-gradient(90deg, ${stops.join(',')})"></div>
     <div class="lg-ticks"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>`;
}
function fmtHour(h){
  if(h===0) return '12 AM';
  if(h<12) return h+' AM';
  if(h===12) return '12 PM';
  return (h-12)+' PM';
}
function fmtHourDecimal(h){
  const hr = Math.floor(h), mn = Math.round((h-hr)*60);
  const ampm = hr>=12?'PM':'AM', dh = hr%12 || 12;
  return `${dh}:${String(mn).padStart(2,'0')} ${ampm}`;
}

async function geocode(q){
  const r = await fetch('/api/geocode?q=' + encodeURIComponent(q));
  if(!r.ok) throw new Error('geocode http '+r.status);
  return r.json();
}
async function fetchReport(lat, lon, name, dayIdx){
  const r = await fetch(`/api/report?lat=${lat}&lon=${lon}&name=${encodeURIComponent(name||'')}&day_index=${dayIdx||0}`);
  if(!r.ok) throw new Error('report http '+r.status);
  return r.json();
}

function renderHeader(d){
  $('rName').textContent = (_last.name || 'YOUR LOCATION').toUpperCase();
  $('rCoords').textContent = `${_last.lat.toFixed(4)}°N  ${Math.abs(_last.lon).toFixed(4)}°${_last.lon<0?'W':'E'}${d.zone?'  ·  '+d.zone:''}${d.elevationFt?'  ·  '+Math.round(d.elevationFt)+' ft':''}`;
  const ph = d.phase || {};
  if(ph.label){
    $('rPhase').innerHTML = `<span class="phase-pill ${ph.phase||''}">${ph.label}${typeof ph.daysFromPeak==='number'?` · D${ph.daysFromPeak>=0?'+':''}${ph.daysFromPeak}`:''}</span>`;
  } else $('rPhase').innerHTML = '';
}

function renderBigNum(d){
  const score = d.score || 0;
  const peakLabel = fmtHour(d.peakHour||0);
  const factors = (d.peakFactors||[]).slice(0,3).join(' · ').toUpperCase() || 'CHECK CONDITIONS';
  const moonIcon = (d.moon && d.moon.icon) || '';
  const moonLabel = (d.moon && d.moon.label) || '';
  const moonPct = d.moon && d.moon.illumination!=null ? Math.round(d.moon.illumination*100)+'%' : '';
  $('bignum').innerHTML = `
    <div>
      <div><span class="bn-num" style="color:${scoreTextColor(score)}">${score}</span><span class="bn-suffix">%</span></div>
      <div class="bn-row" style="margin-top:6px">PEAK · <strong>${peakLabel}</strong></div>
    </div>
    <div class="bn-meta">
      <div class="bn-row">DAY AVG · <strong>${d.avgScore||0}%</strong></div>
      <div class="bn-row">DRIVERS · <strong>${factors}</strong></div>
      <div class="bn-row">${moonIcon} ${moonLabel} <strong>${moonPct}</strong></div>
    </div>`;
}

function renderWeek(d){
  const week = d.weeklyForecast || [];
  const best = d.bestDayIndex;
  $('week').innerHTML = week.map((day,i) => {
    const date = new Date(day.date + 'T00:00');
    const dn = i===0 ? 'TODAY' : date.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
    const wc = WX[day.weatherCode] || '';
    const tHi = day.tempMaxF!=null ? Math.round(day.tempMaxF) : '—';
    const tLo = day.tempMinF!=null ? Math.round(day.tempMinF) : '—';
    return `<div class="dc${i===_last.dayIdx?' active':''}${i===best?' best':''}" onclick="selectDay(${i})">
      <div class="dc-day">${dn}</div>
      <div class="dc-num" style="color:${scoreTextColor(day.peakScore)}">${day.peakScore}</div>
      <div class="dc-pct">PEAK ${fmtHour(day.peakHour)}</div>
      <div class="dc-icon">${wc}</div>
      <div class="dc-tlo">${tHi}° / ${tLo}°</div>
    </div>`;
  }).join('');
}

function renderHourly(d, isToday){
  const grid = $('hourlyGrid');
  const axis = $('hourlyAxis');
  const hourly = d.hourly || [];
  if(!hourly.length){ grid.innerHTML=''; axis.innerHTML=''; return; }
  const peak = hourly.reduce((a,b)=>a.score>b.score?a:b);
  const nowHour = new Date().getHours();
  grid.innerHTML = hourly.map(h => {
    const heightPct = Math.max(5, h.score);
    const tipRows = [
      `${fmtHour(h.hour)} · ${h.score}%`,
      h.factors && h.factors.length ? h.factors.join(' · ') : '',
      h.tempF!=null ? `${Math.round(h.tempF)}°F · ${h.windMph!=null?Math.round(h.windMph)+' mph '+(h.windCompass||''):''}` : '',
      h.pressureD24!=null ? `ΔP ${h.pressureD24>0?'+':''}${h.pressureD24} hPa/24h` : '',
    ].filter(Boolean);
    const tip = tipRows.map(r => `<div class="hh-tip-row">${r}</div>`).join('');
    const isNow = isToday && h.hour===nowHour;
    const isPeak = h.hour===peak.hour;
    return `<div class="hh${isNow?' now':''}${isPeak?' peak':''}">
      <div class="hh-bar" style="height:${heightPct}%;background:${scoreColor(h.score)}"></div>
      <div class="hh-pct">${h.score}%</div>
      <div class="hh-tip">${tip}</div>
    </div>`;
  }).join('');
  if(d.sunriseHour!=null){
    grid.insertAdjacentHTML('beforeend',
      `<div class="solar-line" style="left:${(d.sunriseHour/24)*100}%" data-label="↑ ${fmtHourDecimal(d.sunriseHour)}"></div>`);
  }
  if(d.sunsetHour!=null){
    grid.insertAdjacentHTML('beforeend',
      `<div class="solar-line sunset" style="left:${(d.sunsetHour/24)*100}%" data-label="↓ ${fmtHourDecimal(d.sunsetHour)}"></div>`);
  }
  axis.innerHTML = hourly.map(h => `<div>${h.hour%3===0?(h.hour===0?'12a':h.hour===12?'12p':h.hour<12?h.hour+'a':(h.hour-12)+'p'):''}</div>`).join('');

  const dateStr = d.dayLabel ? new Date(d.dayLabel + 'T00:00').toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'}).toUpperCase() : '';
  $('hourlySec').textContent = `HOURLY MOVEMENT % · ${dateStr}`;
}

function renderConditions(d){
  const w = d.wind || {};
  const peakHour = (d.hourly||[]).find(h => h.hour === d.peakHour) || {};
  const press = peakHour.pressureHpa, d24 = peakHour.pressureD24;
  let pressureSub = '';
  if(d24!=null){
    if(d24 >= 2)      pressureSub = `<span class="cd-sub up">↑ +${d24} / 24h</span>`;
    else if(d24<=-2)  pressureSub = `<span class="cd-sub down">↓ ${d24} / 24h</span>`;
    else              pressureSub = `<span class="cd-sub">≈ stable</span>`;
  }
  const cards = [
    {lbl:'TEMP @ PEAK', val: peakHour.tempF!=null?Math.round(peakHour.tempF):'—', unit:'°F'},
    {lbl:'WIND @ PEAK', val: w.speedMph!=null?Math.round(w.speedMph):'—', unit:' mph', sub: w.compass?`<span class="cd-sub">${w.compass}</span>`:''},
    {lbl:'PRESSURE',    val: press!=null?Math.round(press):'—', unit:' hPa', sub: pressureSub},
    {lbl:'MOON',        val: d.moon && d.moon.illumination!=null?Math.round(d.moon.illumination*100):'—', unit:'%', sub: d.moon&&d.moon.label?`<span class="cd-sub">${d.moon.label}</span>`:''},
    {lbl:'ELEVATION',   val: d.elevationFt?Math.round(d.elevationFt):'—', unit:' ft', sub: d.zone?`<span class="cd-sub">${d.zone}</span>`:''},
  ];
  $('cond').innerHTML = cards.map(c => `
    <div class="cd">
      <div class="cd-lbl">${c.lbl}</div>
      <div class="cd-val">${c.val}<span class="cd-unit">${c.unit}</span></div>
      ${c.sub||''}
    </div>`).join('');
}

function renderSpots(spots){
  const all = [...(spots.forests||[]), ...(spots.wmas||[]), ...(spots.refuges||[])];
  if(!all.length){ $('spotsList').innerHTML = '<div style="color:var(--text3);font-family:JetBrains Mono,monospace;font-size:.65rem;letter-spacing:1px;padding:10px">NO PUBLIC LAND DATA FOR THIS AREA</div>'; return; }
  $('spotsList').innerHTML = all.slice(0,12).map(s => `
    <div class="spot-row">
      <span class="spot-name">${s.name}</span>
      <span class="spot-dist">${s.distance||''}</span>
    </div>`).join('');
}

async function selectDay(idx){
  _last.dayIdx = idx;
  document.querySelectorAll('.dc').forEach((el,i)=>el.classList.toggle('active', i===idx));
  if(_last.lat == null) return;
  await renderReport(idx);
}
window.selectDay = selectDay;

async function renderReport(dayIdx){
  showLoader(true); hideErr();
  try{
    const d = await fetchReport(_last.lat, _last.lon, _last.name, dayIdx);
    _last.data = d;
    renderHeader(d);
    renderBigNum(d);
    renderWeek(d);
    renderHourly(d, dayIdx===0);
    renderConditions(d);
    renderSpots(d.spots||{});
    $('rpt').style.display='block';
    $('rpt').dataset.hasReport='1';
    if(dayIdx===0) $('rpt').scrollIntoView({behavior:'smooth',block:'start'});
  } catch(e){
    console.error(e);
    showErr('Could not build report — '+e.message);
  } finally {
    showLoader(false);
  }
}

async function runSearch(q){
  hideErr();
  showLoader(true);
  try{
    const loc = await geocode(q);
    if(loc.error || loc.lat==null){ showErr(loc.error||'Could not find that location'); showLoader(false); return; }
    _last.lat = loc.lat;
    _last.lon = loc.lon;
    _last.name = loc.name || q;
    _last.dayIdx = 0;
    await renderReport(0);
  } catch(e){
    showErr('Search failed — '+e.message);
    showLoader(false);
  }
}

$('searchBtn').onclick = () => { const q=$('locInput').value.trim(); if(q) runSearch(q); };
$('locInput').addEventListener('keydown', e => { if(e.key==='Enter') $('searchBtn').click(); });
buildLegendScale();

// Try the browser's geolocation. On success run the report; on failure
// behave according to `silent` — auto-load suppresses errors so the user
// just sees the search bar, the GPS button surfaces them.
async function useGeolocation(silent){
  if(!navigator.geolocation){
    if(!silent) showErr('Geolocation not supported');
    return false;
  }
  return new Promise(resolve => {
    showLoader(true);
    navigator.geolocation.getCurrentPosition(
      async pos => {
        _last.lat = pos.coords.latitude;
        _last.lon = pos.coords.longitude;
        _last.dayIdx = 0;
        // Friendly name via reverse geocode — non-blocking; fall back to coords if it fails.
        _last.name = `${_last.lat.toFixed(3)}°N, ${Math.abs(_last.lon).toFixed(3)}°${_last.lon<0?'W':'E'}`;
        try{
          const r = await fetch(`/api/reverse-geocode?lat=${_last.lat}&lon=${_last.lon}`);
          if(r.ok){
            const j = await r.json();
            if(j.name) _last.name = j.name;
          }
        } catch {}
        await renderReport(0);
        resolve(true);
      },
      err => {
        if(!silent) showErr('Location: ' + err.message);
        showLoader(false);
        resolve(false);
      },
      { timeout: 10000, maximumAge: 600000 }
    );
  });
}
$('gpsBtn').onclick = () => useGeolocation(false);

// Auto-load on first visit. Browser will prompt once; if denied or unavailable
// we silently fall back to the search bar.
window.addEventListener('load', () => {
  if (_last.lat != null) return;
  if (!navigator.geolocation) return;
  // Skip auto-prompt if the user has previously denied it (Permissions API).
  if (navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({name:'geolocation'}).then(p => {
      if (p.state !== 'denied') useGeolocation(true);
    }).catch(() => useGeolocation(true));
  } else {
    useGeolocation(true);
  }
});
</script>
