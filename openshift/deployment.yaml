apiVersion: apps/v1
kind: Deployment
metadata:
  name: huntreport
  labels:
    app: huntreport
    app.kubernetes.io/name: huntreport
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: huntreport
  template:
    metadata:
      labels:
        app: huntreport
    spec:
      containers:
        - name: huntreport
          image: quay-server.apps.sno-mini.shanehomelab.com/shane/huntreport:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
